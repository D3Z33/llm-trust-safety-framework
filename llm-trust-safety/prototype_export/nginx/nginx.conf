upstream phoenix_backend {
    server backend:8000;
    keepalive 32;
}

upstream phoenix_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_read_timeout 60s;

    # ── Segurança básica ──────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API — proxy para backend ──────────────────────────────────
    location /api/ {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── WebSocket — proxy para backend ────────────────────────────
    location /ws/ {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Swagger / ReDoc / Health ──────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json|health) {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Assets estáticos — cache longo ────────────────────────────
    location ~* \.(js|css|png|jpg|svg|ico|woff2|woff|ttf)$ {
        proxy_pass http://phoenix_frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend (React SPA) — deve vir por último ────────────────
    location / {
        proxy_pass http://phoenix_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 256;
}
