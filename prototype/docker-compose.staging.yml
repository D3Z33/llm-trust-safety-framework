version: '3.9'

# ──────────────────────────────────────────────────────────────────
# Phoenix — Docker Compose para Staging / VM
# Uso: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# ──────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phoenix-backend
    env_file: .env.staging
    environment:
      # Garante que o banco fica no volume persistido
      - DATABASE_URL=sqlite+aiosqlite:////app/data/phoenix.db
    volumes:
      - phoenix-data:/app/data
    expose:
      - "8000"
    networks:
      - phoenix-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/readiness"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio = URLs relativas; nginx faz o proxy para o backend
        VITE_API_URL: ""
    container_name: phoenix-frontend
    expose:
      - "80"
    networks:
      - phoenix-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: phoenix-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - phoenix-net
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  phoenix-net:
    driver: bridge

volumes:
  phoenix-data:
    driver: local
